<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="320" height="200"></canvas>
<script src="../node_modules/hydra-synth/dist/hydra-synth.js"></script>
<script>
window.go = (code, t) => {
  if (!window.h) window.h = new Hydra({ canvas: document.getElementById('c'), detectAudio: false, makeGlobal: true, autoLoop: false, width: 320, height: 200 });
  window.H = (p) => () => p;  // stand-in for Strudel's H(): fixed value for a still frame
  hush();
  eval(code);
  for (let i = 0; i < 40; i++) h.tick(1000 / 30);  // advance ~1.3 s
  for (let i = 0; i < 1; i++) {}
  return true;
};
</script></body></html>
